<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Güzeloba Kasa v7</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Çilingir Kasa">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1067/1067555.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1067/1067555.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        input, select, button { font-size: 16px !important; }
        .tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; }
    </style>
</head>
<body class="pb-32">

    <header class="bg-indigo-950 text-white p-6 shadow-2xl rounded-b-[3rem] sticky top-0 z-50">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-black tracking-tighter uppercase text-indigo-100">Güzeloba Çilingir</h1>
                <p id="tarihGoster" class="text-[10px] opacity-60 font-bold uppercase"></p>
            </div>
            <div id="saatGoster" class="text-2xl font-mono font-black text-yellow-400">00:00</div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4 text-center">
            <div class="bg-white/5 border border-white/10 p-3 rounded-2xl">
                <span class="text-[9px] font-bold opacity-60 uppercase tracking-wider">Bugünkü İş</span>
                <div id="gunlukCiro" class="text-lg font-bold text-emerald-400">0 TL</div>
            </div>
            <div class="bg-white/5 border border-white/10 p-3 rounded-2xl text-orange-400">
                <span class="text-[9px] font-bold opacity-60 uppercase tracking-wider">Toplam Veresiye</span>
                <div id="toplamVeresiye" class="text-lg font-bold text-orange-400">0 TL</div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-red-500/10 border border-red-500/20 p-4 rounded-2xl text-center">
                <span class="text-[9px] font-bold text-red-400 uppercase">Aylık Gider</span>
                <div id="aylikGider" class="text-xl font-black text-red-500">0 TL</div>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-2xl text-center">
                <span class="text-[9px] font-bold text-emerald-400 uppercase">Net Kasa</span>
                <div id="netKasa" class="text-xl font-black text-emerald-500">0 TL</div>
            </div>
        </div>
    </header>

    <main class="px-4 mt-6 space-y-4">
        <div id="formContainer" class="bg-white p-5 rounded-3xl shadow-xl border border-slate-100">
            <input id="aciklama" type="text" placeholder="Müşteri Adı veya İşlem" class="w-full p-4 mb-3 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-900 text-sm font-medium">
            <div class="flex gap-2 mb-4">
                <input id="tutar" type="number" placeholder="Tutar" class="w-1/2 p-4 border border-slate-200 rounded-2xl outline-none text-sm font-bold">
                <select id="tip" class="w-1/2 p-4 border border-slate-200 rounded-2xl bg-slate-50 font-bold text-xs uppercase">
                    <option value="gelir">GELİR (+)</option>
                    <option value="gider">GİDER (-)</option>
                    <option value="veresiye">VERESİYE (BORÇ)</option>
                </select>
            </div>
            <button onclick="islemKaydet()" class="w-full bg-indigo-950 text-white font-black py-4 rounded-2xl active:scale-95 transition shadow-lg uppercase tracking-wider text-sm">Sisteme İşle</button>
        </div>

        <div class="space-y-6">
            <div>
                <h3 class="text-[10px] font-black text-slate-400 px-3 mb-3 uppercase tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Bugünkü Kayıtlar
                </h3>
                <div id="islemListesi" class="space-y-2"></div>
            </div>

            <div>
                <h3 class="text-[10px] font-black text-orange-500 px-3 mb-3 uppercase tracking-widest flex items-center gap-2">
                    <span class="w-2 h-2 bg-orange-500 rounded-full"></span> Veresiye Defteri (Açık Borçlar)
                </h3>
                <div id="veresiyeListesi" class="space-y-2"></div>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t p-4 flex justify-between items-center px-10 shadow-2xl">
        <button onclick="copyIBAN()" class="text-[10px] font-black text-indigo-600">IBAN KOPYALA</button>
        <button onclick="exportData()" class="text-xs font-black text-slate-700 uppercase">📊 RAPOR</button>
        <button onclick="veriyiSifirla()" class="text-[10px] text-red-300 font-bold uppercase">SIFIRLA</button>
    </div>

    <script>
        let islemler = JSON.parse(localStorage.getItem('guzeloba_v7')) || [];

        function copyIBAN() {
            navigator.clipboard.writeText("Mehmet Soner Eroğlu\nTR29 0001 2001 2680 0009 1029 92");
            alert("İsim ve IBAN kopyalandı!");
        }

        function islemKaydet() {
            const aciklama = document.getElementById('aciklama').value;
            const tutar = parseFloat(document.getElementById('tutar').value);
            const tip = document.getElementById('tip').value;
            const simdi = new Date();

            if (!aciklama || isNaN(tutar)) return alert("Lütfen açıklama ve tutar giriniz.");

            const veri = {
                id: Date.now(),
                aciklama,
                tutar,
                tip, // gelir, gider, veresiye
                saat: simdi.getHours().toString().padStart(2, '0') + ":" + simdi.getMinutes().toString().padStart(2, '0'),
                tarih: simdi.toISOString().split('T')[0],
                ay: simdi.getMonth() + 1,
                durum: "acik" // Sadece veresiyeler için
            };

            islemler.unshift(veri);
            localStorage.setItem('guzeloba_v7', JSON.stringify(islemler));
            
            document.getElementById('aciklama').value = '';
            document.getElementById('tutar').value = '';
            ekraniGuncelle();
        }

        function borcKapat(id) {
            if(confirm("Bu borç ödendi olarak kaydedilsin mi?")) {
                const index = islemler.findIndex(i => i.id === id);
                if(index > -1) {
                    islemler[index].tip = 'gelir';
                    islemler[index].aciklama = "ÖDENDİ: " + islemler[index].aciklama;
                    localStorage.setItem('guzeloba_v7', JSON.stringify(islemler));
                    ekraniGuncelle();
                }
            }
        }

        function ekraniGuncelle() {
            const liste = document.getElementById('islemListesi');
            const vListe = document.getElementById('veresiyeListesi');
            const gCiroText = document.getElementById('gunlukCiro');
            const vToplamText = document.getElementById('toplamVeresiye');
            const aGiderText = document.getElementById('aylikGider');
            const netKasaText = document.getElementById('netKasa');
            
            const simdi = new Date();
            const bugunStr = simdi.toISOString().split('T')[0];
            const buAy = simdi.getMonth() + 1;

            let gunlukBrut = 0;
            let aylikBrut = 0;
            let aylikGider = 0;
            let veresiyeToplam = 0;

            liste.innerHTML = '';
            vListe.innerHTML = '';

            islemler.forEach(islem => {
                // Borç Toplamı (Veresiyeler kasayı etkilemez)
                if(islem.tip === 'veresiye') {
                    veresiyeToplam += islem.tutar;
                    vListe.innerHTML += `
                        <div class="bg-orange-50 p-4 rounded-2xl flex justify-between items-center border border-orange-100 shadow-sm">
                            <div>
                                <div class="font-bold text-orange-900 text-xs uppercase">${islem.aciklama}</div>
                                <div class="text-[9px] text-orange-400 font-bold">${islem.tarih}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="font-black text-orange-600">${islem.tutar.toLocaleString('tr-TR')} TL</div>
                                <button onclick="borcKapat(${islem.id})" class="bg-orange-500 text-white text-[9px] px-2 py-1 rounded-lg font-bold">ÖDENDİ</button>
                            </div>
                        </div>
                    `;
                }

                // Aylık ve Günlük Hesaplar
                if(islem.ay === buAy) {
                    if(islem.tip === 'gelir') aylikBrut += islem.tutar;
                    else if(islem.tip === 'gider') aylikGider += islem.tutar;
                }

                if(islem.tarih === bugunStr && islem.tip !== 'veresiye') {
                    if(islem.tip === 'gelir') gunlukBrut += islem.tutar;
                    liste.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100">
                            <div>
                                <div class="font-bold text-slate-800 text-xs uppercase">${islem.aciklama}</div>
                                <div class="text-[10px] text-slate-400 font-bold">${islem.saat}</div>
                            </div>
                            <div class="font-black ${islem.tip === 'gelir' ? 'text-emerald-600' : 'text-red-500'}">
                                ${islem.tip === 'gelir' ? '+' : '-'}${islem.tutar.toLocaleString('tr-TR')} TL
                            </div>
                        </div>
                    `;
                }
            });

            gCiroText.innerText = gunlukBrut.toLocaleString('tr-TR') + " TL";
            vToplamText.innerText = veresiyeToplam.toLocaleString('tr-TR') + " TL";
            aGiderText.innerText = aylikGider.toLocaleString('tr-TR') + " TL";
            netKasaText.innerText = (aylikBrut - aylikGider).toLocaleString('tr-TR') + " TL";
        }

        setInterval(() => {
            const n = new Date();
            document.getElementById('saatGoster').innerText = n.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function exportData() {
            let csv = "Tarih,Tip,Islem,Tutar,Saat\n";
            islemler.forEach(i => { csv += `${i.tarih},${i.tip},${i.aciklama},${i.tutar},${i.saat}\n`; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "guzeloba_kasa_v7.csv";
            link.click();
        }

        function veriyiSifirla() {
            if(confirm("Tüm kayıtlar silinecektir! Emin misiniz?")) {
                localStorage.clear();
                location.reload();
            }
        }

        document.getElementById('tarihGoster').innerText = new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        ekraniGuncelle();
    </script>
</body>
</html>
