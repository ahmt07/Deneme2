<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güzeloba Çilingir Kasa Takip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <header class="bg-blue-700 text-white p-6 shadow-lg rounded-b-3xl">
        <h1 class="text-xl font-bold">Güzeloba Çilingir</h1>
        <p class="text-sm opacity-80">Mobil Kasa Takip Sistemi</p>
        <div class="mt-4 bg-white/20 p-4 rounded-2xl backdrop-blur-md">
            <span class="text-xs uppercase tracking-wider">Güncel Kasa</span>
            <div id="toplamKasa" class="text-3xl font-bold">0.00 TL</div>
        </div>
    </header>

    <main class="p-4 space-y-4">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-200">
            <h2 class="font-semibold mb-3">Yeni İşlem Kaydı</h2>
            <div class="space-y-3">
                <input id="aciklama" type="text" placeholder="İşlem (Örn: Kale Kilit Değişimi)" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
                <div class="flex gap-2">
                    <input id="tutar" type="number" placeholder="Tutar (TL)" class="w-1/2 p-3 border rounded-xl outline-none">
                    <select id="tip" class="w-1/2 p-3 border rounded-xl outline-none bg-gray-50">
                        <option value="gelir">Gelir (+)</option>
                        <option value="gider">Gider (-)</option>
                    </select>
                </div>
                <button onclick="islemEkle()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">KAYDET</button>
            </div>
        </div>

        <div class="space-y-2">
            <h2 class="font-semibold px-2">Son İşlemler</h2>
            <div id="islemListesi" class="space-y-2">
                </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-around text-xs font-medium text-gray-500">
        <button onclick="verileriTemizle()" class="text-red-500">KASAYI SIFIRLA</button>
        <span>© 2026 Güzeloba Teknik</span>
    </nav>

    <script>
        let islemler = JSON.parse(localStorage.getItem('cilingir_kasa')) || [];

        function islemEkle() {
            const aciklama = document.getElementById('aciklama').value;
            const tutar = parseFloat(document.getElementById('tutar').value);
            const tip = document.getElementById('tip').value;

            if (!aciklama || !tutar) return alert("Lütfen bilgileri girin!");

            const yeniIslem = {
                id: Date.now(),
                aciklama,
                tutar: tip === 'gelir' ? tutar : -tutar,
                tarih: new Date().toLocaleDateString('tr-TR')
            };

            islemler.unshift(yeniIslem);
            localStorage.setItem('cilingir_kasa', JSON.stringify(islemler));
            
            document.getElementById('aciklama').value = '';
            document.getElementById('tutar').value = '';
            arayuzuGuncelle();
        }

        function arayuzuGuncelle() {
            const liste = document.getElementById('islemListesi');
            const kasaText = document.getElementById('toplamKasa');
            let toplam = 0;

            liste.innerHTML = '';
            islemler.forEach(islem => {
                toplam += islem.tutar;
                const renk = islem.tutar > 0 ? 'text-green-600' : 'text-red-600';
                liste.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center border-l-4 ${islem.tutar > 0 ? 'border-green-500' : 'border-red-500'}">
                        <div>
                            <div class="font-medium">${islem.aciklama}</div>
                            <div class="text-xs text-gray-400">${islem.tarih}</div>
                        </div>
                        <div class="font-bold ${renk}">${islem.tutar.toFixed(2)} TL</div>
                    </div>
                `;
            });

            kasaText.innerText = toplam.toFixed(2) + " TL";
        }

        function verileriTemizle() {
            if(confirm("Tüm kasa geçmişi silinecek. Emin misiniz?")) {
                localStorage.removeItem('cilingir_kasa');
                islemler = [];
                arayuzuGuncelle();
            }
        }

        // İlk açılışta verileri yükle
        arayuzuGuncelle();
    </script>
</body>
</html>
