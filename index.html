<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güzeloba Kasa v3 - IBAN Entegre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .kapanis-geldi { border: 3px solid #ef4444; }
    </style>
</head>
<body class="pb-32">

    <header class="bg-blue-900 text-white p-5 shadow-2xl rounded-b-[2rem]">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-lg font-bold italic">GÜZELOBA ÇİLİNGİR</h1>
                <p id="tarihGoster" class="text-[10px] opacity-70"></p>
            </div>
            <div id="saatGoster" class="text-xl font-mono font-bold text-yellow-400">00:00</div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white/10 p-3 rounded-2xl border border-white/5">
                <span class="text-[10px] uppercase opacity-70">Günlük Ciro</span>
                <div id="gunlukCiro" class="text-xl font-bold text-green-400">0 TL</div>
            </div>
            <div class="bg-white/10 p-3 rounded-2xl border border-white/5">
                <span class="text-[10px] uppercase opacity-70">Aylık Toplam</span>
                <div id="aylikCiro" class="text-xl font-bold text-blue-300">0 TL</div>
            </div>
        </div>
        
        <div id="kapanisUyari" class="hidden mt-3 p-2 bg-red-600 text-center rounded-lg text-[10px] font-bold uppercase animate-pulse">
            ⚠️ SAAT 22:00 - GÜN KAPANIŞI AKTİF
        </div>
    </header>

    <section class="p-4">
        <div class="bg-blue-50 border-2 border-blue-200 p-4 rounded-2xl flex justify-between items-center shadow-sm">
            <div class="overflow-hidden">
                <p class="text-[10px] font-bold text-blue-800 uppercase">Hızlı IBAN Paylaş</p>
                <p class="text-xs font-semibold text-slate-700 truncate">Mehmet Soner Eroğlu</p>
                <p id="ibanText" class="text-[11px] font-mono text-slate-600">TR29 0001 2001 2680 0009 1029 92</p>
            </div>
            <button onclick="copyIBAN()" class="bg-blue-600 text-white p-2 px-4 rounded-xl text-xs font-bold active:bg-blue-800 transition">KOPYALA</button>
        </div>
    </section>

    <main class="px-4 space-y-4">
        <div id="formContainer" class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
            <input id="aciklama" type="text" placeholder="İşlem Açıklaması" class="w-full p-3 mb-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-900 text-sm">
            <div class="flex gap-2 mb-3">
                <input id="tutar" type="number" placeholder="Tutar" class="w-2/3 p-3 border rounded-xl outline-none text-sm">
                <select id="tip" class="w-1/3 p-3 border rounded-xl bg-gray-50 font-bold text-xs">
                    <option value="gelir">GELİR (+)</option>
                    <option value="gider">GİDER (-)</option>
                </select>
            </div>
            <button onclick="islemKaydet()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-xl active:scale-95 transition">SİSTEME İŞLE</button>
        </div>

        <div>
            <h3 class="text-[10px] font-bold text-gray-400 px-2 mb-2 uppercase tracking-widest">Bugünkü Servisler</h3>
            <div id="islemListesi" class="space-y-2 text-sm"></div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t p-4 flex justify-between items-center px-6 shadow-lg">
        <button onclick="exportData()" class="text-xs font-bold text-blue-700 underline">📊 RAPOR (CSV)</button>
        <button onclick="veriyiSifirla()" class="text-[10px] text-gray-300">Sıfırla</button>
    </div>

    <script>
        let islemler = JSON.parse(localStorage.getItem('guzeloba_v3')) || [];

        function copyIBAN() {
            const iban = "TR29 0001 2001 2680 0009 1029 92";
            const isim = "Mehmet Soner Eroğlu";
            const text = isim + "\n" + iban;
            navigator.clipboard.writeText(text);
            alert("İsim ve IBAN kopyalandı!");
        }

        function islemKaydet() {
            const aciklama = document.getElementById('aciklama').value;
            const tutar = parseFloat(document.getElementById('tutar').value);
            const tip = document.getElementById('tip').value;
            const simdi = new Date();

            if (!aciklama || isNaN(tutar)) return alert("Tutar ve açıklama giriniz!");

            const veri = {
                id: Date.now(),
                aciklama,
                tutar: tip === 'gelir' ? tutar : -tutar,
                saat: simdi.getHours().toString().padStart(2, '0') + ":" + simdi.getMinutes().toString().padStart(2, '0'),
                tarih: simdi.toISOString().split('T')[0],
                ay: simdi.getMonth() + 1
            };

            islemler.unshift(veri);
            localStorage.setItem('guzeloba_v3', JSON.stringify(islemler));
            
            document.getElementById('aciklama').value = '';
            document.getElementById('tutar').value = '';
            ekraniGuncelle();
        }

        function ekraniGuncelle() {
            const liste = document.getElementById('islemListesi');
            const gCiroText = document.getElementById('gunlukCiro');
            const aCiroText = document.getElementById('aylikCiro');
            const simdi = new Date();
            const bugunStr = simdi.toISOString().split('T')[0];
            const buAy = simdi.getMonth() + 1;

            let gunlukToplam = 0;
            let aylikToplam = 0;

            liste.innerHTML = '';

            islemler.forEach(islem => {
                if(islem.ay === buAy) aylikToplam += islem.tutar;

                if(islem.tarih === bugunStr) {
                    gunlukToplam += islem.tutar;
                    liste.innerHTML += `
                        <div class="bg-white p-4 rounded-xl flex justify-between items-center shadow-sm border border-gray-100">
                            <div>
                                <div class="font-semibold text-slate-800">${islem.aciklama}</div>
                                <div class="text-[10px] text-gray-400">${islem.saat}</div>
                            </div>
                            <div class="font-bold ${islem.tutar > 0 ? 'text-green-600' : 'text-red-500'}">
                                ${islem.tutar.toFixed(2)} TL
                            </div>
                        </div>
                    `;
                }
            });

            gCiroText.innerText = gunlukToplam.toFixed(2) + " TL";
            aCiroText.innerText = aylikToplam.toFixed(2) + " TL";

            // 22:00 Kontrolü
            if (simdi.getHours() >= 22) {
                document.getElementById('kapanisUyari').classList.remove('hidden');
                document.getElementById('formContainer').style.opacity = "0.4";
                document.getElementById('formContainer').style.pointerEvents = "none";
            }
        }

        setInterval(() => {
            const n = new Date();
            document.getElementById('saatGoster').innerText = n.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function exportData() {
            let csv = "Tarih,Islem,Tutar,Saat\n";
            islemler.forEach(i => { csv += `${i.tarih},${i.aciklama},${i.tutar},${i.saat}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = window.URL.createObjectURL(blob);
            a.download = 'guzeloba_rapor.csv';
            a.click();
        }

        function veriyiSifirla() {
            if(confirm("Tüm veriler silinecek!")) {
                localStorage.clear();
                islemler = [];
                location.reload();
            }
        }

        document.getElementById('tarihGoster').innerText = new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' });
        ekraniGuncelle();
    </script>
</body>
</html>
