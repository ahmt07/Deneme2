<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Güzeloba Kasa v11.5</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Çilingir Kasa">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        input, select, button { font-size: 16px !important; }
        .modal-active { transform: translateY(0%); transition: transform 0.3s ease-out; }
    </style>
</head>
<body class="pb-32 overflow-x-hidden">

    <header class="bg-indigo-950 text-white p-6 shadow-2xl rounded-b-[3rem] sticky top-0 z-40">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-xl font-black tracking-tighter uppercase text-indigo-100">Güzeloba Çilingir</h1>
                <p id="tarihGoster" class="text-[10px] opacity-60 font-bold uppercase"></p>
            </div>
            <div id="saatGoster" class="text-2xl font-mono font-black text-yellow-400">00:00</div>
        </div>

        <div class="bg-white/10 border border-white/20 p-3 rounded-2xl mb-4 flex items-center justify-between">
            <div onclick="copyIBAN()" class="flex-1">
                <span class="text-[8px] font-bold opacity-60 uppercase tracking-widest block">DOKUN KOPYALA</span>
                <span id="ibanText" class="text-[13px] font-mono font-bold text-indigo-200">TR29 0001 2001 2680 0009 1029 92</span>
            </div>
            <button onclick="showQR()" class="bg-white/20 p-2 rounded-xl ml-2 active:scale-90 transition">
                <span class="text-xl">📷</span>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-3 text-center">
            <div class="bg-white/5 border border-white/10 p-3 rounded-2xl">
                <span class="text-[9px] font-bold opacity-60 uppercase">Bugünkü İş</span>
                <div id="gunlukCiro" class="text-lg font-bold text-emerald-400">0 TL</div>
            </div>
            <button onclick="toggleVeresiye(true)" class="bg-orange-500/20 border border-orange-500/40 p-3 rounded-2xl active:scale-95 transition">
                <span class="text-[9px] font-bold text-orange-400 uppercase">Veresiye Defteri</span>
                <div id="toplamVeresiye" class="text-lg font-bold text-orange-400">0 TL</div>
            </button>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-3">
            <div class="bg-sky-500/10 border border-sky-500/20 p-2 rounded-xl text-center">
                <span class="text-[8px] font-bold text-sky-400 uppercase">Ay Ciro</span>
                <div id="aylikCiro" class="text-sm font-black text-sky-400">0 TL</div>
            </div>
            <div class="bg-red-500/10 border border-red-500/20 p-2 rounded-xl text-center">
                <span class="text-[8px] font-bold text-red-400 uppercase">Ay Gider</span>
                <div id="aylikGider" class="text-sm font-black text-red-500">0 TL</div>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 p-2 rounded-xl text-center">
                <span class="text-[8px] font-bold text-emerald-400 uppercase">Ay Net</span>
                <div id="aylikNet" class="text-sm font-black text-emerald-400">0 TL</div>
            </div>
        </div>

        <div class="bg-white/10 border border-white/20 p-3 rounded-2xl text-center">
            <span class="text-[9px] font-bold opacity-60 uppercase text-indigo-200">Genel Kasa</span>
            <div id="netKasa" class="text-xl font-black text-white">0 TL</div>
        </div>
    </header>

    <div id="qrModal" onclick="closeQR()" class="fixed inset-0 bg-black/80 z-[100] hidden backdrop-blur-md flex items-center justify-center p-10">
        <div class="bg-white p-6 rounded-[2rem] text-center" onclick="event.stopPropagation()">
            <p class="text-xs font-bold text-slate-400 mb-4 uppercase">Ödeme İçin Kamerayla Okutun</p>
            <div id="qrcode" class="flex justify-center mb-4"></div>
            <p class="text-[10px] text-slate-800 font-mono mb-4 break-all">TR29 0001 2001 2680 0009 1029 92</p>
            <button onclick="closeQR()" class="w-full bg-indigo-950 text-white py-3 rounded-xl font-bold">KAPAT</button>
        </div>
    </div>

    <main class="px-4 mt-6 space-y-6">
        <div id="formContainer" class="bg-white p-5 rounded-3xl shadow-xl border border-slate-100">
            <input id="aciklama" type="text" placeholder="İşlem veya Müşteri Adı" class="w-full p-4 mb-3 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-900 text-sm font-medium">
            <div class="flex gap-2 mb-4">
                <input id="tutar" type="number" placeholder="Tutar" class="w-1/2 p-4 border border-slate-200 rounded-2xl outline-none text-sm font-bold">
                <select id="tip" class="w-1/2 p-4 border border-slate-200 rounded-2xl bg-slate-50 font-bold text-xs uppercase">
                    <option value="gelir">GELİR (+)</option>
                    <option value="gider">GİDER (-)</option>
                    <option value="veresiye">VERESİYE (BORÇ)</option>
                </select>
            </div>
            <button onclick="islemKaydet()" class="w-full bg-indigo-950 text-white font-black py-4 rounded-2xl active:scale-95 transition shadow-lg uppercase tracking-wider text-sm">Kaydet</button>
        </div>

        <div>
            <h3 class="text-[10px] font-black text-slate-400 px-3 mb-3 uppercase tracking-widest text-center">Bugünün Kayıtları</h3>
            <div id="islemListesi" class="space-y-2"></div>
        </div>
    </main>

    <div id="veresiyePanel" class="fixed inset-0 bg-black/60 z-[100] hidden backdrop-blur-sm flex items-end">
        <div class="bg-slate-50 w-full h-[85vh] rounded-t-[3rem] shadow-2xl flex flex-col p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-slate-800 uppercase tracking-tighter">Veresiye Defteri</h2>
                <button onclick="toggleVeresiye(false)" class="bg-slate-200 p-2 rounded-full px-4 text-xs font-bold text-slate-600">KAPAT</button>
            </div>
            <div class="relative mb-4 text-xs font-medium text-orange-600">İsim ile borçlu ara:</div>
            <div class="relative mb-4">
                <input type="text" id="veresiyeArama" onkeyup="veresiyeAra()" placeholder="Müşteri adı..." class="w-full p-4 pl-12 bg-white border border-slate-200 rounded-2xl shadow-sm outline-none focus:ring-2 focus:ring-orange-500 font-medium">
                <span class="absolute left-4 top-4 opacity-30 text-xl">🔍</span>
            </div>
            <div id="veresiyeListesi" class="flex-1 overflow-y-auto space-y-3 pb-10"></div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t p-4 flex justify-between items-center px-10 shadow-2xl z-40">
        <button onclick="exportData()" class="text-[10px] font-black text-slate-700 uppercase">📊 RAPOR AL</button>
        <button onclick="veriyiSifirla()" class="text-[10px] text-red-300 font-bold uppercase">SIFIRLA</button>
    </div>

    <script>
        let islemler = JSON.parse(localStorage.getItem('guzeloba_v11_5')) || [];
        const myIBAN = "TR29 0001 2001 2680 0009 1029 92";

        function copyIBAN() {
            navigator.clipboard.writeText(myIBAN);
            alert("IBAN Kopyalandı!");
        }

        function showQR() {
            document.getElementById('qrModal').classList.remove('hidden');
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: myIBAN,
                width: 200,
                height: 200
            });
        }

        function closeQR() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        function toggleVeresiye(open) {
            const panel = document.getElementById('veresiyePanel');
            if(open) { panel.classList.remove('hidden'); ekraniGuncelle(); } 
            else { panel.classList.add('hidden'); }
        }

        function islemKaydet() {
            const aciklama = document.getElementById('aciklama').value;
            const tutar = parseFloat(document.getElementById('tutar').value);
            const tip = document.getElementById('tip').value;
            const simdi = new Date();
            if (!aciklama || isNaN(tutar)) return alert("Eksik bilgi!");
            const veri = {
                id: Date.now(),
                aciklama, tutar, tip,
                saat: simdi.getHours().toString().padStart(2, '0') + ":" + simdi.getMinutes().toString().padStart(2, '0'),
                tarih: simdi.toISOString().split('T')[0],
                ay: simdi.getMonth() + 1
            };
            islemler.unshift(veri);
            localStorage.setItem('guzeloba_v11_5', JSON.stringify(islemler));
            document.getElementById('aciklama').value = '';
            document.getElementById('tutar').value = '';
            ekraniGuncelle();
        }

        function borcKapat(id) {
            const index = islemler.findIndex(i => i.id === id);
            if(index > -1) {
                const simdi = new Date();
                islemler[index].tip = 'gelir';
                islemler[index].tarih = simdi.toISOString().split('T')[0];
                islemler[index].aciklama = "TAHSİLAT: " + islemler[index].aciklama;
                localStorage.setItem('guzeloba_v11_5', JSON.stringify(islemler));
                ekraniGuncelle();
            }
        }

        function veresiyeAra() {
            const input = document.getElementById('veresiyeArama').value.toUpperCase();
            document.querySelectorAll('.veresiye-item').forEach(item => {
                const text = item.getAttribute('data-name').toUpperCase();
                item.style.display = text.includes(input) ? "" : "none";
            });
        }

        function ekraniGuncelle() {
            const liste = document.getElementById('islemListesi');
            const vListe = document.getElementById('veresiyeListesi');
            const simdi = new Date();
            const bugunStr = simdi.toISOString().split('T')[0];
            const buAy = simdi.getMonth() + 1;

            let gCiro = 0, aBrut = 0, aGider = 0, vTop = 0, genGelir = 0, genGider = 0;
            liste.innerHTML = ''; vListe.innerHTML = '';

            islemler.forEach(islem => {
                if(islem.tip === 'veresiye') {
                    vTop += islem.tutar;
                    vListe.innerHTML += `
                        <div class="veresiye-item bg-white p-4 rounded-2xl flex justify-between items-center border border-slate-200 shadow-sm" data-name="${islem.aciklama}">
                            <div class="flex-1">
                                <div class="font-bold text-slate-800 text-xs uppercase">${islem.aciklama}</div>
                                <div class="text-[9px] text-slate-400 font-bold">${islem.tarih}</div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="font-black text-orange-600 text-sm">${islem.tutar.toLocaleString('tr-TR')} TL</div>
                                <button onclick="borcKapat(${islem.id})" class="bg-orange-500 text-white text-[10px] px-3 py-2 rounded-xl font-black">ÖDENDİ</button>
                            </div>
                        </div>`;
                } else {
                    if(islem.tip === 'gelir') genGelir += islem.tutar;
                    if(islem.tip === 'gider') genGider += islem.tutar;
                    if(islem.ay === buAy) {
                        if(islem.tip === 'gelir') aBrut += islem.tutar;
                        if(islem.tip === 'gider') aGider += islem.tutar;
                    }
                    if(islem.tarih === bugunStr) {
                        if(islem.tip === 'gelir') gCiro += islem.tutar;
                        liste.innerHTML += `
                            <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100">
                                <div><div class="font-bold text-slate-800 text-xs uppercase">${islem.aciklama}</div><div class="text-[10px] text-slate-400 font-bold">${islem.saat}</div></div>
                                <div class="font-black ${islem.tip === 'gelir' ? 'text-emerald-600' : 'text-red-500'}">
                                    ${islem.tip === 'gelir' ? '+' : '-'}${islem.tutar.toLocaleString('tr-TR')} TL
                                </div>
                            </div>`;
                    }
                }
            });

            document.getElementById('gunlukCiro').innerText = gCiro.toLocaleString('tr-TR') + " TL";
            document.getElementById('toplamVeresiye').innerText = vTop.toLocaleString('tr-TR') + " TL";
            document.getElementById('aylikCiro').innerText = aBrut.toLocaleString('tr-TR') + " TL";
            document.getElementById('aylikGider').innerText = aGider.toLocaleString('tr-TR') + " TL";
            document.getElementById('aylikNet').innerText = (aBrut - aGider).toLocaleString('tr-TR') + " TL";
            document.getElementById('netKasa').innerText = (genGelir - genGider).toLocaleString('tr-TR') + " TL";
        }

        setInterval(() => {
            const n = new Date();
            document.getElementById('saatGoster').innerText = n.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function exportData() {
            let csv = "Tarih,Tip,Islem,Tutar\n";
            islemler.forEach(i => { csv += `${i.tarih},${i.tip},${i.aciklama},${i.tutar}\n`; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "guzeloba_kasa_v11_5.csv";
            link.click();
        }

        function veriyiSifirla() {
            if(confirm("Tüm veriler silinecek!")) { localStorage.clear(); location.reload(); }
        }

        document.getElementById('tarihGoster').innerText = new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        ekraniGuncelle();
    </script>
</body>
</html>
