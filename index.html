<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güzeloba Kasa v5 - Birikimli Takip</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="pb-32">

    <header class="bg-indigo-950 text-white p-6 shadow-2xl rounded-b-[3rem]">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-black tracking-tighter">GÜZELOBA ÇİLİNGİR</h1>
                <p id="tarihGoster" class="text-[10px] opacity-60 font-bold uppercase"></p>
            </div>
            <div id="saatGoster" class="text-2xl font-mono font-black text-yellow-400">00:00</div>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-white/5 border border-white/10 p-3 rounded-2xl">
                <span class="text-[9px] font-bold opacity-60 uppercase">Bugünkü İş Toplamı</span>
                <div id="gunlukCiro" class="text-lg font-bold text-emerald-400">0 TL</div>
            </div>
            <div class="bg-white/5 border border-white/10 p-3 rounded-2xl">
                <span class="text-[9px] font-bold opacity-60 uppercase">Aylık Brüt Ciro</span>
                <div id="aylikCiro" class="text-lg font-bold text-sky-400">0 TL</div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-red-500/10 border border-red-500/20 p-4 rounded-2xl text-center">
                <span class="text-[9px] font-bold text-red-400 uppercase">Aylık Toplam Gider</span>
                <div id="aylikGider" class="text-xl font-black text-red-500">0 TL</div>
            </div>
            <div class="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-2xl text-center">
                <span class="text-[9px] font-bold text-emerald-400 uppercase">Cepte Kalan (Net)</span>
                <div id="netKasa" class="text-xl font-black text-emerald-500">0 TL</div>
            </div>
        </div>
        
        <div id="kapanisUyari" class="hidden mt-4 p-2 bg-red-600 text-center rounded-xl text-[10px] font-bold uppercase animate-pulse text-white">
            🔒 SAAT 22:00 - GÜN KAPANIŞI YAPILDI
        </div>
    </header>

    <section class="p-4">
        <div class="bg-white border-2 border-indigo-50 p-4 rounded-2xl flex justify-between items-center shadow-sm">
            <div class="overflow-hidden">
                <p class="text-[9px] font-black text-indigo-600 uppercase mb-1">Hızlı IBAN</p>
                <p class="text-xs font-bold text-slate-800">Mehmet Soner Eroğlu</p>
                <p class="text-[11px] font-mono text-slate-500 truncate">TR29 0001 2001 2680 0009 1029 92</p>
            </div>
            <button onclick="copyIBAN()" class="bg-indigo-600 text-white p-3 px-5 rounded-xl text-xs font-black active:scale-90 transition">KOPYALA</button>
        </div>
    </section>

    <main class="px-4 space-y-4">
        <div id="formContainer" class="bg-white p-5 rounded-3xl shadow-xl border border-slate-100">
            <input id="aciklama" type="text" placeholder="İşlem veya Gider Açıklaması" class="w-full p-4 mb-3 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-900 text-sm">
            <div class="flex gap-2 mb-4">
                <input id="tutar" type="number" placeholder="Tutar" class="w-2/3 p-4 border border-slate-200 rounded-2xl outline-none text-sm font-bold">
                <select id="tip" class="w-1/3 p-4 border border-slate-200 rounded-2xl bg-slate-50 font-bold text-xs">
                    <option value="gelir">GELİR (+)</option>
                    <option value="gider">GİDER (-)</option>
                </select>
            </div>
            <button onclick="islemKaydet()" class="w-full bg-indigo-950 text-white font-black py-4 rounded-2xl active:scale-95 transition shadow-lg uppercase tracking-wider text-sm">Sisteme İşle</button>
        </div>

        <div>
            <h3 class="text-[10px] font-black text-slate-400 px-3 mb-3 uppercase tracking-widest">Bugünkü Servisler</h3>
            <div id="islemListesi" class="space-y-3"></div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t p-4 flex justify-between items-center px-8 shadow-2xl">
        <button onclick="exportData()" class="text-xs font-black text-indigo-900 uppercase tracking-tighter">📊 Raporu İndir</button>
        <button onclick="veriyiSifirla()" class="text-[10px] text-slate-300 font-bold">Veriyi Temizle</button>
    </div>

    <script>
        let islemler = JSON.parse(localStorage.getItem('guzeloba_v5')) || [];

        function copyIBAN() {
            navigator.clipboard.writeText("Mehmet Soner Eroğlu\nTR29 0001 2001 2680 0009 1029 92");
            alert("Kopyalandı!");
        }

        function islemKaydet() {
            const aciklama = document.getElementById('aciklama').value;
            const tutar = parseFloat(document.getElementById('tutar').value);
            const tip = document.getElementById('tip').value;
            const simdi = new Date();

            if (!aciklama || isNaN(tutar)) return alert("Eksik bilgi!");

            const veri = {
                id: Date.now(),
                aciklama,
                tutar,
                tip,
                saat: simdi.getHours().toString().padStart(2, '0') + ":" + simdi.getMinutes().toString().padStart(2, '0'),
                tarih: simdi.toISOString().split('T')[0],
                ay: simdi.getMonth() + 1
            };

            islemler.unshift(veri);
            localStorage.setItem('guzeloba_v5', JSON.stringify(islemler));
            
            document.getElementById('aciklama').value = '';
            document.getElementById('tutar').value = '';
            ekraniGuncelle();
        }

        function ekraniGuncelle() {
            const liste = document.getElementById('islemListesi');
            const gCiroText = document.getElementById('gunlukCiro');
            const aCiroText = document.getElementById('aylikCiro');
            const aGiderText = document.getElementById('aylikGider');
            const netKasaText = document.getElementById('netKasa');
            
            const simdi = new Date();
            const bugunStr = simdi.toISOString().split('T')[0];
            const buAy = simdi.getMonth() + 1;

            let gunlukBrut = 0;
            let aylikBrut = 0;
            let aylikGider = 0;

            liste.innerHTML = '';

            islemler.forEach(islem => {
                // Aylık Hesaplamalar
                if(islem.ay === buAy) {
                    if(islem.tip === 'gelir') {
                        aylikBrut += islem.tutar;
                    } else {
                        aylikGider += islem.tutar;
                    }
                }

                // Günlük Hesaplamalar ve Liste
                if(islem.tarih === bugunStr) {
                    if(islem.tip === 'gelir') gunlukBrut += islem.tutar;
                    
                    liste.innerHTML += `
                        <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-100">
                            <div>
                                <div class="font-bold text-slate-800 text-xs uppercase">${islem.aciklama}</div>
                                <div class="text-[10px] text-slate-400 font-bold">${islem.saat}</div>
                            </div>
                            <div class="font-black ${islem.tip === 'gelir' ? 'text-emerald-600' : 'text-red-500'}">
                                ${islem.tip === 'gelir' ? '+' : '-'}${islem.tutar.toLocaleString('tr-TR')} TL
                            </div>
                        </div>
                    `;
                }
            });

            gCiroText.innerText = gunlukBrut.toLocaleString('tr-TR') + " TL";
            aCiroText.innerText = aylikBrut.toLocaleString('tr-TR') + " TL";
            aGiderText.innerText = aylikGider.toLocaleString('tr-TR') + " TL";
            netKasaText.innerText = (aylikBrut - aylikGider).toLocaleString('tr-TR') + " TL";

            // 22:00 Kontrolü
            if (simdi.getHours() >= 22) {
                document.getElementById('kapanisUyari').classList.remove('hidden');
                document.getElementById('formContainer').style.opacity = "0.5";
                document.getElementById('formContainer').style.pointerEvents = "none";
            }
        }

        setInterval(() => {
            const n = new Date();
            document.getElementById('saatGoster').innerText = n.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        }, 1000);

        function exportData() {
            let csv = "Tarih,Tip,Islem,Tutar,Saat\n";
            islemler.forEach(i => { csv += `${i.tarih},${i.tip},${i.aciklama},${i.tutar},${i.saat}\n`; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "guzeloba_servis_raporu.csv";
            link.click();
        }

        function veriyiSifirla() {
            if(confirm("Tüm veriler silinecektir. Onaylıyor musunuz?")) {
                localStorage.clear();
                location.reload();
            }
        }

        document.getElementById('tarihGoster').innerText = new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        ekraniGuncelle();
    </script>
</body>
</html>
